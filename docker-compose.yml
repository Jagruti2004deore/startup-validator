services:
  api:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/validator.db
    ports:
      - "8000:8000"
    volumes:
      - validator-data:/data

  ui:
    build: .
    command: ["sh", "-c", "streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"]
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  validator-data: